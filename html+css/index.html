<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="../bootstrap-5.0.2/bootstrap-5.0.2/dist/css/bootstrap.css">
    <link rel="icon" href="../bootstrap-icons-1.13.1/bootstrap-icons-1.13.1/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <main class="d-flex justify-content-center align-items-center">
        <div class="container">
            <div class="border p-4">
                <div class="title d-flex justify-content-between p-2">
                    <h2>Task List</h2>
                    <button class="btn btn-primary rounded-4" data-bs-toggle="modal" data-bs-target="#addTaskForm">+ Add Task</button>
                </div>
                <div id="list" class="p-2">
                    <ul class="cards ps-0">
                        <li class="card p-2">
                            <div class="row">
                                <div class="col-3"> <small>task</small> <h6>Go to gym</h6>
                                </div>
                                <div class="col-3"> <small>priority</small> <h6 class="text-danger text-outline-danger">High</h6>
                                </div>
                                <div class="col-2 d-flex justify-content-center align-items-center">
                                    <div class="bg-secondary">To Do</div>
                                </div>
                                <div class="col-2 d-flex justify-content-center align-items-center">
                                    <i class="bi bi-circle task3-circle"></i>
                                </div>
                                <div class="col-2 d-flex justify-content-center align-items-center">
                                    <div class="d-flex align-items-center gap-5">
                                        <i class="bi bi-pencil-square"></i>
                                        <i class="bi bi-trash3 text-danger"></i>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

                <div class="modal" id="addTaskForm" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h4 class="modal-title fw-bold">Add task</h4>
                                <button class="btn-close" type="button" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <small class="fw-bold text-secondary">Task</small>
                                <form>
                                    <input type="text" class="form-control" placeholder="Type your task here...">
                                </form>
                                <small class="fw-bold text-secondary d-flex mt-3">Priority</small>
                                <div class="d-flex gap-3 mt-3">
                                    <button
                                        class="border border-danger px-2 py-2 btn btn-outline-danger fw-semibold">High</button>
                                    <button
                                        class="border border-warning px-2 py-2 btn btn-outline-warning fw-semibold">Medium</button>
                                    <button
                                        class="border border-success px-2 py-2 btn btn-outline-success fw-semibold">Low</button>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-outline-secondary" type="button" fw-semibold>Add</button>
                            </div>
                        </div>
                    </div>
                </div>
    </main>

    <script src="../bootstrap-5.0.2/bootstrap-5.0.2/dist/js/bootstrap.js"></script>
</body>

</html>
