<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="../bootstrap-5.0.2/bootstrap-5.0.2/dist/css/bootstrap.css">
    <link rel="icon" href="../bootstrap-icons-1.13.1/bootstrap-icons-1.13.1/bootstrap-icons.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="border p-4">
                <div class="title d-flex justify-content-between p-2">
                    <h2>Task List</h2>
                    <button class="btn btn-primary rounded-4">+ Add Task</button>
                </div>
                <div id="list" class="p-2">
                    <ul class="cards">
                        <li class="card p-2">
                            <div class="row">
                                <div class="col-3"> task <h6>Go to gym</h6> </div>
                                <div class="col-3"> priority <h6>High</h6> </div>
                                <div class="col-2 d-flex justify-content-center align-items-center">
                                    <div class="btn btn-secondary">To Do</div>
                                </div>
                                <div class="col-2"></div>
                                <div class="col-2">
                                    <i class="bi bi-heart-fill" style="font-size: 2rem; color: red;"></i>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="border p-4 bg-secondary">
                <div class="d-flex justify-content-between">
                    
                </div>
            </div>
        </div>
    </main>

    <script src="../bootstrap-5.0.2/bootstrap-5.0.2/dist/js/bootstrap.js"></script>
</body>
</html>
